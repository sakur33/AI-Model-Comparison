# Model registry + pricing.
#
# Prices below are verified. Model ids are still marked TODO: confirm them against
# the Anthropic and CompactifAI docs/dashboards before running real comparisons.
# Prices are USD per 1M tokens. Leave a price as null to show "n/a" in reports.
# Token usage is stored with every result, so you can change prices here (or
# with `glmcompare report --price KEY=IN,OUT`) and re-run the report for free.

models:
  sonnet:
    label: "Claude Sonnet 5.5"
    provider: anthropic
    model: claude-sonnet-5-5            # TODO: confirm exact model id
    api_key_env: ANTHROPIC_API_KEY
    params:
      max_tokens: 8192
    pricing:
      input_per_mtok: 2.0       
      output_per_mtok: 10.0
      cache_read_per_mtok: 0.1         # optional

  glm:
    label: "GLM 5.3 (CompactifAI API)"
    provider: openai_compatible
    model: glm-5-3                      # TODO: confirm exact model id on CompactifAI
    api_key_env: COMPACTIFAI_API_KEY
    base_url_env: COMPACTIFAI_BASE_URL
    params:
      max_tokens: 32768
      temperature: 0
    pricing:
      input_per_mtok: 0.2
      output_per_mtok: 0.64
      cache_read_per_mtok: 0.018

  # Offline model that answers with the reference solution. Used to test the
  # pipeline end-to-end without API keys.
  mock:
    label: "Mock (reference solutions)"
    provider: mock
    model: mock
    params: {}
    pricing:
      input_per_mtok: 1.0
      output_per_mtok: 5.0
